kind = "web"
previewPath = "/"
title = "Daga Plastic Industries"
version = "1.0.0"
id = "artifacts/daga-plastic"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21490

[services.development]
run = "pnpm --filter @workspace/daga-plastic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/daga-plastic", "run", "build" ]
publicDir = "artifacts/daga-plastic/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21490"
BASE_PATH = "/"
